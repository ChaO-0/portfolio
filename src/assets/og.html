<!--
  Source for public/og.png. Not built or served: it is rendered to a PNG by hand
  when the headline or the product list changes.

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --disable-gpu --hide-scrollbars --screenshot=public/og.png \
    --window-size=1200,630 --virtual-time-budget=15000 src/assets/og.html
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #0b1013;
        color: #e7edec;
        font-family: "Geist", sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow: hidden;
      }
      /* the same hairline grid the site draws between its sections */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#212c2c 1px, transparent 1px),
          linear-gradient(90deg, #212c2c 1px, transparent 1px);
        background-size: 100px 100px;
        opacity: 0.45;
      }
      .glow {
        position: absolute;
        top: -180px;
        right: -140px;
        width: 760px;
        height: 760px;
        background: radial-gradient(circle, rgba(87, 200, 165, 0.14), transparent 62%);
      }
      .pad { position: relative; height: 100%; padding: 62px 64px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand span { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
      .mid { margin-top: auto; margin-bottom: auto; }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        color: #57c8a5;
        margin-bottom: 30px;
      }
      h1 {
        font-size: 80px;
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.042em;
      }
      .mint { color: #57c8a5; }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #212c2c;
        padding-top: 22px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.1em;
        color: #7a8886;
      }
      .live { display: flex; align-items: center; gap: 26px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #57c8a5; }
      .avail { color: #57c8a5; display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="pad">
      <div class="brand">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <mask id="c">
            <rect width="48" height="48" fill="#fff" />
            <circle cx="24" cy="24" r="8" fill="#000" />
            <rect x="24" y="18" width="24" height="12" fill="#000" />
          </mask>
          <circle cx="24" cy="24" r="24" fill="#57C8A5" mask="url(#c)" />
        </svg>
        <span>Christopher Yu</span>
      </div>

      <div class="mid">
        <div class="eyebrow">PRODUCT ENGINEER &nbsp;·&nbsp; BALI &nbsp;·&nbsp; UTC+8</div>
        <h1>
          I build products<br />
          from idea to <span class="mint">production</span>.
        </h1>
      </div>

      <div class="foot">
        <div class="live">
          <span class="avail"><span class="dot"></span>AVAILABLE NOW</span>
          <span>MONARK &nbsp; CLASSPORTAL &nbsp; STENCIL</span>
        </div>
        <span>christopheryu.com</span>
      </div>
    </div>
  </body>
</html>
